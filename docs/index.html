    function setLang(lang) {
      const t = T[lang];
      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
      document.title = t.title;
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t[el.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t[el.dataset.i18nHtml]; });
      document.querySelectorAll('img[data-src]').forEach((img) => {
        img.src = `screenshots/${lang}/${img.dataset.src}.webp`;
        img.alt = ALT[lang][img.dataset.src];
      });
      document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
      try { localStorage.setItem('ygo_proxies_site_lang', lang); } catch { /* sem armazenamento */ }
    }

    document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));

    try { inicial = localStorage.getItem('ygo_proxies_site_lang') || ''; } catch { inicial = ''; }
    if (!T[inicial]) inicial = (navigator.language || 'en').toLowerCase().startsWith('pt') ? 'pt' : 'en';
